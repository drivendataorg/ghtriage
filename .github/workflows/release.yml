name: release
run-name: Release of ${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
      dry-run:
        description: 'Dry run'
        required: false
        default: false
        type: boolean

jobs:
  check-version:
    name: Check metadata version is correct
    runs-on: "ubuntu-latest"
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-suffix: "dev"

      - name: Check that versions match
        run: |
          echo "Input version tag: [${INPUTS_VERSION}] "
          PACKAGE_VERSION=$(uv run python -m vspect read .)
          echo "Package version: [$PACKAGE_VERSION]"
          [[ ${INPUTS_VERSION} == "v$PACKAGE_VERSION" ]] || exit 1
        env:
          INPUTS_VERSION: ${{ inputs.version }}

  build-and-inspect-package:
    name: Build and inspect package
    needs: check-version
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Need both of these for attest-build-provenance-github
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          attest-build-provenance-github: ${{ !inputs.dry-run }}

  upload-to-test-pypi:
    name: Upload package to Test PyPI
    needs: build-and-inspect-package
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  upload-to-prod-pypi:
    name: Upload package to Prod PyPI
    needs: upload-to-test-pypi
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  create-github-release:
    name: Create GitHub release
    needs: upload-to-prod-pypi
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built artifact to dist/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - id: extract-changelog
        uses: sean0x42/markdown-extract@7b185cbe85263116bbf741e739e7198ba86465dc # v2.1.0
        with:
          file: CHANGELOG.md
          pattern: ${{ inputs.version }}

      - name: Write output to file
        run: |
          printf '%s\n' "$STEPS_EXTRACT_CHANGELOG_OUTPUTS_MARKDOWN" > __CHANGELOG-extracted.md
        env:
          STEPS_EXTRACT_CHANGELOG_OUTPUTS_MARKDOWN: ${{ steps.extract-changelog.outputs.markdown }}

      - name: Create release
        run: |
          gh release create "${INPUTS_VERSION}" \
            --target "${GITHUB_SHA}" \
            --notes-file __CHANGELOG-extracted.md \
            ./dist/*.whl \
            ./dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUTS_VERSION: ${{ inputs.version }}
